name: Deploy Project
on: [push, workflow_dispatch]
jobs:
  test:
      runs-on: windows-latest
      steps:
        - name: Get code
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install dependencies
          run: npm ci  
        - name: Run tests
          run: npm test
  deploy:
    needs: test #To add multiple jobs, can be done using [job1, job2, job3]. Names rely on job Id (String)
    runs-on: windows-latest
    steps: 
        - name: Get code
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install dependencies
          run: npm ci 
        - name: Build Project
          run: npm run build
        - name: Deploy
          run: echo "Deploying project..."